# Pedalboard 3 — GitLab CI pipeline.
#
# Linux:
#   - lint:format runs on saas-linux (a one-line clang-format check;
#     stock ubuntu:24.04 + a 2-package apt install).
#   - build:image:linux (pre-build stage) builds ci/docker/Dockerfile.linux
#     via kaniko on saas-linux and pushes to the project Container
#     Registry. Runs only when Dockerfile or .gitlab-ci.yml changes;
#     manual fallback otherwise.
#   - build:linux + test:linux:unit run on saas-linux using the prebuilt
#     ci-linux:latest image (so no apt-install at job time — toolchain
#     comes baked into the image).
# The self-hosted weeb-cluster runner is parked while its k8s infra
# settles; once the cluster is stable, flip these tags back to
# weeb-cluster to win on the ninja compile step. (See AGENTS.md notes
# on Phase-6 self-hosting.)
# macOS: build + unit tests on GitLab.com's saas-macos-medium-m1 (Apple
# Silicon, brew preinstalled). Auto on MRs + v3-rewrite, NOT on main (a
# green MR doesn't need a slow re-run on merge); main runs only the fast
# Linux gate plus the manual release jobs. `allow_failure: true` while it
# stabilises.
# Windows: build + unit tests on GitLab.com's saas-windows-medium-amd64
# (Windows Server 2022, VS 2022 Build Tools + CMake preinstalled). Same
# MR-only posture as macOS (no ~34 min Windows re-run on main), same
# `allow_failure: true`. Installer signing for releases is still Phase 6 work.
#
# Full multi-platform + signing pipeline lives in the plan at
# docs/plans/2026-04-12-001-feat-pedalboard-3-rewrite-plan.md (Appendix C).

stages:
  - lint
  - pre-build
  - build
  - test
  - release

variables:
  CI_DEBUG_TRACE: "false"              # AC-SE-19: never leak secrets to logs
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: "recursive"  # harmless in Phase 0; future-proofs
  CPM_SOURCE_CACHE: "${CI_PROJECT_DIR}/.cpm-cache"
  CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
  CCACHE_MAXSIZE: "2G"
  DEBIAN_FRONTEND: "noninteractive"
  CI_LINUX_IMAGE: "${CI_REGISTRY_IMAGE}/ci-linux:latest"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

.rules-default: &rules-default
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'   # initial dev branch

# macOS build/test runs on every MR push (the gate) + v3-rewrite, but NOT on
# main: a merge of an already-green MR doesn't need the slow macOS Debug
# re-run. On main, macOS is exercised only by the manual release:macos job.
# (The fast Linux build/test still runs on main as an integration smoke of
# the merged state — see .rules-default.) `allow_failure: true` keeps a slow
# macOS run off an MR's critical path.
.rules-macos: &rules-macos
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Windows build/test runs on every MR push (the gate) + v3-rewrite, but NOT on
# main — same rationale as macOS: skip the ~34 min Windows Debug re-run on a
# merge that was already green on its MR. On main, Windows is exercised only by
# the manual release:windows job. `allow_failure: true` until the runs stabilise.
# Signing-cert provisioning for installers remains Phase 6 (not needed here).
.rules-windows: &rules-windows
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Release jobs: main branch ONLY, and manual (a click in the pipeline UI).
# They live in the final `release` stage so a pending manual job never
# blocks earlier stages (the trap documented on .rules-ci-image). Paired
# with `allow_failure: true` on each release job so an un-clicked manual
# action leaves the pipeline green rather than "blocked".
.rules-release: &rules-release
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    when: manual

# Image build runs only when the recipe (Dockerfile) or pipeline that
# consumes it changes. NO `when: manual` catch-all: a manual-pending job
# in pre-build blocks downstream stages even with `optional: true` on
# build:linux's `needs:`, which would force the user to click the play
# button before every Linux build runs. Instead, a forced rebuild is
# triggered by setting `REBUILD_CI_IMAGE=true` via "Run pipeline" in
# the UI; otherwise the job is absent from the pipeline and build:linux
# pulls whatever :latest is already in the registry.
.rules-ci-image: &rules-ci-image
  - if: '$REBUILD_CI_IMAGE == "true"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - ci/docker/Dockerfile.linux
      - .gitlab-ci.yml
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes:
      - ci/docker/Dockerfile.linux
      - .gitlab-ci.yml

.cache-linux: &cache-linux
  cache:
    - key: "cpm-${CI_PROJECT_PATH_SLUG}"
      paths: [ .cpm-cache/ ]
      policy: pull-push
    - key: "ccache-${CI_JOB_NAME_SLUG}"
      paths: [ .ccache/ ]
      policy: pull-push

# Windows runner has no ccache (sccache is the analog but not yet wired).
# CPM cache alone is the big-ticket item — it saves the JUCE source tarball
# fetch (+ Catch2 etc.) per pipeline. ~50 MB cache, ~30 s saved on rerun.
.cache-windows: &cache-windows
  cache:
    - key: "cpm-${CI_PROJECT_PATH_SLUG}"
      paths: [ .cpm-cache/ ]
      policy: pull-push

# Lint-only setup: clang-format + just. Skips the heavy build toolchain
# that ci-linux:latest carries. Lint runs on saas-linux on a stock
# ubuntu:24.04 image to avoid blocking on cluster state for a check
# that takes <30 s.
.lint-setup: &lint-setup
  - apt-get update -qq
  - apt-get install -y --no-install-recommends clang-format-18 just
  - ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

# saas-macos-large-m2pro ships Xcode + Homebrew preinstalled but minimal
# beyond that. Install only what CMakePresets/just need; everything else
# (Apple Clang, AudioToolbox, CoreAudio frameworks) is already present.
.macos-setup: &macos-setup
  - brew update --quiet || true
  - brew install --quiet cmake ninja just pkg-config || true
  - cmake --version
  - ninja --version
  - just --version

# saas-windows-medium-amd64 ships Visual Studio 2022 Build Tools, CMake,
# git, and PowerShell 7 preinstalled. We use Ninja as our generator (per
# windows-dev preset), so we need to enter the VS dev shell before any
# cmake call so MSVC's cl.exe / link.exe are on PATH. vswhere finds the
# installation root; Launch-VsDevShell sets up the environment in-process.
# Ninja is bundled with VS Build Tools at <VS>\Common7\IDE\CommonExtensions\
# Microsoft\CMake\Ninja\ninja.exe — Launch-VsDevShell adds it to PATH too.
#
# vswhere flags: `-latest -prerelease -products *` is the broadest match;
# the SaaS runner has Build Tools (not "regular" VS), and a default
# `-latest -property installationPath` returns empty without the
# -prerelease + -products * combo. -requires VC.Tools narrows to installs
# that actually have the C++ compiler. -format json + Select-Object
# -First 1 is safer than the bare -property form (avoids parsing edge
# cases when multiple installs are present).
.windows-setup: &windows-setup
  # juceaide failure — root cause finally identified in pipeline #136's
  # diagnostic dump. Direct `juceaide.exe version` invocation returned
  # exit code -1073741515 (0xC0000135 / STATUS_DLL_NOT_FOUND), not the
  # Defender termination we initially suspected. JUCE's sub-cmake builds
  # juceaide with CMake's default MSVC runtime selection, which on
  # CMake 3.27 without CMP0091 NEW resolves to /MDd (dynamic debug
  # runtime). The Debug runtime DLLs (ucrtbased.dll, msvcp140d.dll,
  # vcruntime140d.dll) ship with VS but live under VC\Redist\..\debug_nonredist
  # — Launch-VsDevShell.ps1 -Arch amd64 only adds the Release runtime
  # paths. juceaide.exe loads those debug DLLs, can't find them on PATH,
  # exits 0xC0000135 with no console output.
  #
  # Fix: after VsDevShell, locate Microsoft.VC*.DebugCRT under the VS
  # install and prepend it to PATH so juceaide can resolve its imports.
  # Defender disable is kept (cheap, does no harm).
  - 'Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue'
  - '$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"'
  - 'if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }'
  - '$installRoot = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath'
  - 'if (-not $installRoot) { throw "No Visual Studio install with C++ tools found by vswhere." }'
  - 'Write-Host "VS install root: $installRoot"'
  - '$devShell = Join-Path $installRoot ''Common7\Tools\Launch-VsDevShell.ps1'''
  - 'if (-not (Test-Path $devShell)) { throw "VS dev shell not found at $devShell" }'
  - '& $devShell -Arch amd64 -SkipAutomaticLocation'
  # MSVC Debug runtime DLLs — required by anything cmake builds with
  # /MDd. Pipeline #137 identified that the BuildTools install only ships
  # the OneCore subset under VC\Redist\MSVC\<ver>\onecore\debug_nonredist\x64\,
  # which is missing ucrtbased.dll. UCRT (Universal C Runtime) debug
  # ships separately under the Windows 10 SDK at
  # Windows Kits\10\bin\<sdk-version>\x64\ucrt\. Both directories must
  # be on PATH for juceaide.exe to load.
  - '$debugCrt = Get-ChildItem -Path "$installRoot\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.DebugCRT" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\debug_nonredist\x64\*" } | Sort-Object @{Expression={$_.FullName -like "*\onecore\*"}; Ascending=$true}, @{Expression={$_.Name}; Descending=$true} | Select-Object -First 1'
  - 'if ($debugCrt) { $env:PATH = "$($debugCrt.FullName);$env:PATH"; Write-Host "Added MSVC DebugCRT: $($debugCrt.FullName)" } else { Write-Host "WARNING: Microsoft.VC*.DebugCRT not found under $installRoot — juceaide may STATUS_DLL_NOT_FOUND" }'
  # Windows SDK debug UCRT (ucrtbased.dll). Picks the most recent SDK by
  # bin\<version> dir name. WindowsSdkDir is set by Launch-VsDevShell;
  # fall back to the canonical Program Files location if not.
  - '$sdkRoot = if ($env:WindowsSdkDir) { $env:WindowsSdkDir } else { "C:\Program Files (x86)\Windows Kits\10" }'
  - 'Write-Host "Windows SDK root: $sdkRoot"'
  - '$ucrtDebug = Get-ChildItem -Path "$sdkRoot\bin" -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)\x64\ucrt\ucrtbased.dll" } | Sort-Object Name -Descending | Select-Object -First 1'
  - 'if ($ucrtDebug) { $ucrtDir = "$($ucrtDebug.FullName)\x64\ucrt"; $env:PATH = "$ucrtDir;$env:PATH"; Write-Host "Added UCRT debug: $ucrtDir" } else { Write-Host "WARNING: ucrtbased.dll not found under $sdkRoot\bin — juceaide will STATUS_DLL_NOT_FOUND" }'
  # DirectComposition (dcomp.dll) is missing on saas-windows-medium-amd64
  # — it's a Server Core SKU that ships D3D/D2D/DXGI but not dcomp.dll
  # (Pipeline #139 where.exe probe confirmed dcomp.dll -> MISSING). JUCE 8
  # statically imports dcomp.dll via juce_graphics → Direct2D, and juceaide
  # pulls juce_graphics through juce_build_tools. The fix in two passes:
  #   1. Install the Server Core App Compatibility Feature on Demand,
  #      which drops dcomp.dll + other GUI shims into System32.
  #   2. If the FoD path didn't work (or already installed), search the
  #      VS / SDK install for a vendored dcomp.dll and add its dir to
  #      PATH as a fallback.
  # Both are tried; whichever satisfies juceaide's loader wins.
  - 'try { Add-WindowsCapability -Online -Name "ServerCore.AppCompatibility~~~~0.0.1.0" -ErrorAction SilentlyContinue | Out-Null; Write-Host "ServerCore.AppCompatibility install attempted" } catch { Write-Host "AppCompatibility install threw: $_" }'
  - 'if (Test-Path "C:\Windows\System32\dcomp.dll") { Write-Host "dcomp.dll now present in System32" } else { Write-Host "dcomp.dll still missing from System32; searching VS/SDK trees" }'
  - '$dcomp = Get-ChildItem -Path "$installRoot","$sdkRoot" -Recurse -Filter "dcomp.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "arm" } | Select-Object -First 1'
  - 'if ($dcomp) { $env:PATH = "$($dcomp.DirectoryName);$env:PATH"; Write-Host "Found dcomp.dll at: $($dcomp.FullName)" } else { Write-Host "WARNING: dcomp.dll still not found; juceaide will STATUS_DLL_NOT_FOUND" }'
  - cmake --version
  - ninja --version

# ===========================================================================
# LINT
# ===========================================================================
lint:format:
  stage: lint
  image: ubuntu:24.04
  rules: *rules-default
  before_script: *lint-setup
  script:
    - just format-check

# ===========================================================================
# PRE-BUILD — build the Linux CI image once per Dockerfile change
# ===========================================================================
# Runs on saas-linux (no tag), not weeb-cluster: image build is I/O-bound
# (apt downloads, cmake/ninja tarballs from GitHub, layer push to the
# Container Registry). saas-linux is on GitLab's backbone, so push is
# faster than from home-cluster egress. weeb-cluster's 4 vCPU advantage
# only matters for ninja compiles (build:linux), not Dockerfile builds.
build:image:linux:
  stage: pre-build
  rules: *rules-ci-image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    # Auth to the project's Container Registry via CI_JOB_TOKEN. Kaniko
    # reads /kaniko/.docker/config.json on startup.
    - mkdir -p /kaniko/.docker
    - >
      printf '{"auths":{"%s":{"auth":"%s"}}}'
      "${CI_REGISTRY}"
      "$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 -w0)"
      > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/ci/docker/Dockerfile.linux"
      --destination "${CI_REGISTRY_IMAGE}/ci-linux:latest"
      --destination "${CI_REGISTRY_IMAGE}/ci-linux:${CI_COMMIT_SHORT_SHA}"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/ci-linux/cache"
      --snapshot-mode=redo

# ===========================================================================
# BUILD
# ===========================================================================
build:linux:
  stage: build
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-default
  needs:
    - job: build:image:linux
      optional: true
  <<: *cache-linux
  variables:
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
    # Preset is a variable so release:linux can extend this job and only
    # swap in the RelWithDebInfo preset (linux-release).
    PB3_BUILD_PRESET: linux-dev
  script:
    - ccache --zero-stats || true
    - cmake --preset "$PB3_BUILD_PRESET" -S app-v3
    - cmake --build --preset "$PB3_BUILD_PRESET" -- -j$(nproc)
    - ccache --show-stats || true
  artifacts:
    paths:
      - build/linux-dev/
    # Exclude the CPM-fetched dependency tree (JUCE source + VST3 SDK +
    # their build objects, ~570 MB). The test stage runs ctest against our
    # compiled binaries + CTest metadata and never needs the JUCE sources;
    # JUCE links statically, so nothing under _deps is needed at run time.
    # This shrinks the artifact (and any manual download) from ~half a gig
    # to a few MB.
    exclude:
      - "build/linux-dev/_deps/**/*"
      # Our own intermediate objects + CMake internals — not needed once the
      # binaries are linked; this is the bulk of the remaining Debug artifact.
      - "build/linux-dev/**/CMakeFiles/**"
      - "build/linux-dev/**/*.o"
    expire_in: 1 day
    when: on_success

# Windows Debug build on saas-windows-medium-amd64 (GitLab.com SaaS).
# Same posture as build:macos — auto on default/v3-rewrite/MR pushes,
# `allow_failure: true` while it stabilises. Flip mandatory once the
# job is green twice in a row. PowerShell shell (default on the SaaS
# Windows runner). Installer signing-cert provisioning is still Phase
# 6 work and is unrelated to this build+test pair.
build:windows:
  stage: build
  tags: [ saas-windows-medium-amd64 ]
  rules: *rules-windows
  allow_failure: true
  <<: *cache-windows
  before_script: *windows-setup
  variables:
    # Preset is a variable so release:windows can extend this job (reusing
    # all the dcomp/DLL setup below) and only swap in the RelWithDebInfo
    # preset (windows-ci).
    PB3_BUILD_PRESET: windows-dev
  script:
    - |
      # Fetch the Steinberg ASIO SDK from the project's private generic package
      # registry so the Windows build can enable JUCE_ASIO=1 (see the ASIO block
      # in app-v3/CMakeLists.txt and AGENTS.md "Windows: ASIO"). The SDK is GPLv3
      # but kept out of git; a maintainer uploads it once to
      # packages/generic/asio-sdk/<ver>/asio-sdk.zip. Best-effort: if the package
      # isn't there (not yet uploaded, or a fork without registry access) the build
      # continues with WASAPI/DirectSound only — this step never fails the job.
      # curl's non-zero exit does NOT throw in PowerShell, so check $LASTEXITCODE.
      $asioDest = "app-v3/asio_sdk"
      $asioUrl  = "$($env:CI_API_V4_URL)/projects/$($env:CI_PROJECT_ID)/packages/generic/asio-sdk/2.3/asio-sdk.zip"
      curl.exe --fail --silent --show-error --location --header "JOB-TOKEN: $($env:CI_JOB_TOKEN)" --output asio-sdk.zip $asioUrl
      if ($LASTEXITCODE -eq 0 -and (Test-Path asio-sdk.zip)) {
          try {
              New-Item -ItemType Directory -Force $asioDest | Out-Null
              Expand-Archive -Force -Path asio-sdk.zip -DestinationPath $asioDest
              $hdr = Get-ChildItem -Path $asioDest -Recurse -Filter "iasiodrv.h" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hdr) { Write-Host "ASIO SDK ready: $($hdr.FullName) — JUCE_ASIO will be enabled" }
              else { Write-Warning "ASIO SDK archive fetched but iasiodrv.h not found under $asioDest; ASIO stays disabled." }
          } catch {
              Write-Warning "ASIO SDK archive could not be extracted; building WASAPI/DirectSound only. $_"
          }
      } else {
          Write-Warning "ASIO SDK package not available at $asioUrl; building WASAPI/DirectSound only."
      }
      Remove-Item asio-sdk.zip -ErrorAction SilentlyContinue
      # curl --fail exits non-zero on a 404, and GitLab's PowerShell executor
      # fails the whole step if $LASTEXITCODE != 0 at the block's end. This fetch
      # is best-effort and must never fail the build, so reset the exit code.
      cmd /c "exit 0"
    # Patch JUCE to delay-load dcomp.dll. Pipeline #140 confirmed
    # saas-windows-medium-amd64 doesn't ship DirectComposition's
    # dcomp.dll and there's no Microsoft FoD or vendored copy on the
    # runner that puts it in PATH. Without dcomp.dll, juceaide's
    # static import resolution at LoadLibrary time fails 0xC0000135
    # before main() even runs, so juceaide.exe `version` produces
    # empty output and JUCE's "Testing juceaide" FATAL_ERRORs out.
    #
    # juce_graphics.cpp:94 hard-codes `#pragma comment(lib, "DComp.lib")`.
    # The patch below appends `#pragma comment(linker, "/DELAYLOAD:dcomp.dll")`
    # plus a delayimp link, which marks dcomp.dll as delay-loaded —
    # the import table still references it but the loader skips
    # resolution until something calls a DCompositionXxx function.
    # `juceaide version` doesn't, so juceaide loads cleanly.
    # Pedalboard3 itself (which DOES use juce_graphics at runtime)
    # ships to end-users on real Windows where dcomp.dll is present;
    # the delay-load is harmless there.
    #
    # Two-pass: try patch (no-op if cache cold), run cmake, and on
    # juceaide failure re-patch (cache is now populated by CPM) and
    # re-run cmake. Final failure dumps a full diagnostic.
    - |
      function Patch-JuceForDcomp {
          # Two patches, applied together:
          #   1. juce_graphics.cpp: pragma fallback (best-effort).
          #   2. extras/Build/juceaide/CMakeLists.txt: explicit
          #      target_link_options + delayimp link. THIS is the
          #      load-bearing one — pragmas in source proved
          #      unreliable at making /DELAYLOAD stick (pipeline #141).
          $cpmRoot = "$env:CI_PROJECT_DIR\.cpm-cache\juce"
          if (-not (Test-Path $cpmRoot)) { return $false }
          $any = $false
          foreach ($juceDir in (Get-ChildItem -Path $cpmRoot -Directory)) {
              $cpp = Join-Path $juceDir.FullName "modules\juce_graphics\juce_graphics.cpp"
              if (Test-Path $cpp) {
                  $content = Get-Content $cpp -Raw
                  if ($content -notmatch 'DELAYLOAD:dcomp\.dll') {
                      $marker = '#pragma comment(lib, "DComp.lib")'
                      $insert = "$marker`r`n  #pragma comment(lib, `"delayimp.lib`")`r`n  #pragma comment(linker, `"/DELAYLOAD:dcomp.dll`")"
                      $new = $content.Replace($marker, $insert)
                      if ($new -ne $content) {
                          Set-Content -Path $cpp -Value $new -NoNewline
                          Write-Host "Patched source pragma: $cpp"
                          $any = $true
                      }
                  }
              }

              $cml = Join-Path $juceDir.FullName "extras\Build\juceaide\CMakeLists.txt"
              if (Test-Path $cml) {
                  $cmlContent = Get-Content $cml -Raw
                  if ($cmlContent -notmatch 'PB3_DELAYLOAD_DCOMP') {
                      $cmlMarker = 'juce::juce_recommended_warning_flags)'
                      $cmlInsert = "$cmlMarker`r`n`r`n# PB3_DELAYLOAD_DCOMP — delay-load dcomp.dll so juceaide loads on`r`n# Server Core runners that lack DirectComposition.`r`nif(MSVC)`r`n    target_link_options(juceaide PRIVATE `"/DELAYLOAD:dcomp.dll`")`r`n    target_link_libraries(juceaide PRIVATE delayimp)`r`nendif()"
                      $cmlNew = $cmlContent.Replace($cmlMarker, $cmlInsert)
                      if ($cmlNew -ne $cmlContent) {
                          Set-Content -Path $cml -Value $cmlNew -NoNewline
                          Write-Host "Patched juceaide CMakeLists: $cml"
                          $any = $true
                      }
                  } else {
                      Write-Host "Already patched: $cml"
                  }
              }
          }
          return $any
      }

      Patch-JuceForDcomp | Out-Null

      cmake --preset $env:PB3_BUILD_PRESET -S app-v3
      if ($LASTEXITCODE -ne 0) {
          Write-Host "=== first cmake failed; patching JUCE for dcomp delay-load and retrying ==="
          $applied = Patch-JuceForDcomp
          if ($applied) {
              $juceTools = "build\$($env:PB3_BUILD_PRESET)\_deps\juce-build\tools"
              if (Test-Path $juceTools) { Remove-Item -Recurse -Force $juceTools -ErrorAction SilentlyContinue }
              cmake --preset $env:PB3_BUILD_PRESET -S app-v3
          }
          if ($LASTEXITCODE -ne 0) {
              Write-Host "=== cmake configure still failing after delay-load patch; full diagnostic ==="
              $juceaide = Get-ChildItem -Path "build" -Recurse -Filter "juceaide.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($juceaide) {
                  Write-Host "juceaide path: $($juceaide.FullName)"
                  Write-Host "size: $($juceaide.Length) bytes"
                  Write-Host "lastWrite: $($juceaide.LastWriteTime)"
                  Write-Host "--- dumpbin /dependents juceaide.exe ---"
                  try { & dumpbin.exe /dependents $juceaide.FullName | Out-String | Write-Host } catch {}
                  Write-Host "--- direct invocation ---"
                  $stderrFile = New-TemporaryFile
                  $proc = Start-Process -FilePath $juceaide.FullName -ArgumentList "version" -NoNewWindow -PassThru -Wait `
                      -RedirectStandardOutput "juceaide_stdout.txt" -RedirectStandardError $stderrFile.FullName
                  Write-Host "exit code: $($proc.ExitCode)"
                  if (Test-Path "juceaide_stdout.txt") { Write-Host "stdout:"; Get-Content "juceaide_stdout.txt" | Out-String | Write-Host }
                  if (Test-Path $stderrFile.FullName) { Write-Host "stderr:"; Get-Content $stderrFile.FullName | Out-String | Write-Host }
              }
              throw "cmake configure failed even after delay-load patch"
          }
      }
    - cmake --build --preset $env:PB3_BUILD_PRESET -- -j $env:NUMBER_OF_PROCESSORS
  artifacts:
    paths:
      - build/windows-dev/
    # Exclude the ~570 MB CPM dependency tree — see build:linux for the
    # rationale (tests need our binaries, not the JUCE sources).
    exclude:
      - "build/windows-dev/_deps/**/*"
      # Intermediate objects + CMake internals — see build:linux.
      - "build/windows-dev/**/CMakeFiles/**"
      - "build/windows-dev/**/*.obj"
    expire_in: 1 day
    when: on_success

# macOS Debug build on GitLab.com's saas-macos-large-m2pro (Apple Silicon).
# `allow_failure: true` while the job stabilises — flip to mandatory once
# it's green twice in a row. Auto on default branch, manual on MRs (see
# .rules-macos for why).
build:macos:
  stage: build
  tags: [ saas-macos-medium-m1 ]
  rules: *rules-macos
  allow_failure: true
  before_script: *macos-setup
  variables:
    # Preset is a variable so release:macos can extend this job and only
    # swap in the universal RelWithDebInfo preset (macos-universal).
    PB3_BUILD_PRESET: macos-dev
  script:
    - cmake --preset "$PB3_BUILD_PRESET" -S app-v3
    - cmake --build --preset "$PB3_BUILD_PRESET" -- -j$(sysctl -n hw.ncpu)
  artifacts:
    paths:
      - build/macos-dev/
    # Exclude the ~570 MB CPM dependency tree — see build:linux for the
    # rationale (tests need our binaries, not the JUCE sources).
    exclude:
      - "build/macos-dev/_deps/**/*"
      # Intermediate objects + CMake internals — see build:linux.
      - "build/macos-dev/**/CMakeFiles/**"
      - "build/macos-dev/**/*.o"
    expire_in: 1 day
    when: on_success

# ===========================================================================
# TEST
# ===========================================================================
test:linux:unit:
  stage: test
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-default
  needs: [ build:linux ]
  <<: *cache-linux
  script:
    - ctest --preset linux-dev

test:macos:unit:
  stage: test
  tags: [ saas-macos-medium-m1 ]
  rules: *rules-macos
  needs: [ build:macos ]
  allow_failure: true
  before_script: *macos-setup
  script:
    - ctest --preset macos-dev

test:windows:unit:
  stage: test
  tags: [ saas-windows-medium-amd64 ]
  rules: *rules-windows
  needs: [ build:windows ]
  allow_failure: true
  <<: *cache-windows
  before_script: *windows-setup
  script:
    - ctest --preset windows-dev

# ===========================================================================
# RELEASE — RelWithDebInfo builds, MANUAL on the main branch only.
#
# These produce artifacts that run on a clean machine (release CRT + real
# optimisation), unlike the Debug build:* jobs whose artifacts need the VS
# debug runtime installed. Each release job `extends` its build:* sibling so
# it reuses the exact same runner setup and build script (including the
# Windows dcomp/DLL handling) and only overrides the preset (via
# PB3_BUILD_PRESET), the stage, the rules (main + manual), and the artifacts.
#
# `allow_failure: true` keeps an un-clicked manual job from leaving the
# pipeline "blocked". Signing / installers / notarisation are Phase 6 and
# build on top of these.
# ===========================================================================
release:linux:
  extends: build:linux
  stage: release
  rules: *rules-release
  allow_failure: true
  variables:
    PB3_BUILD_PRESET: linux-release
  artifacts:
    paths:
      - build/linux-release/
    exclude:
      - "build/linux-release/_deps/**/*"
      - "build/linux-release/**/CMakeFiles/**"
      - "build/linux-release/**/*.o"
    expire_in: 2 weeks
    when: on_success

release:macos:
  extends: build:macos
  stage: release
  rules: *rules-release
  allow_failure: true
  variables:
    PB3_BUILD_PRESET: macos-universal
  artifacts:
    paths:
      - build/macos-universal/
    exclude:
      - "build/macos-universal/_deps/**/*"
      - "build/macos-universal/**/CMakeFiles/**"
      - "build/macos-universal/**/*.o"
    expire_in: 2 weeks
    when: on_success

release:windows:
  extends: build:windows
  stage: release
  rules: *rules-release
  allow_failure: true
  variables:
    PB3_BUILD_PRESET: windows-ci
  artifacts:
    paths:
      - build/windows-ci/
    exclude:
      - "build/windows-ci/_deps/**/*"
      - "build/windows-ci/**/CMakeFiles/**"
      - "build/windows-ci/**/*.obj"
    expire_in: 2 weeks
    when: on_success
