# Pedalboard 3 — GitLab CI pipeline.
#
# Linux:
#   - lint:format runs on saas-linux (a one-line clang-format check;
#     stock ubuntu:24.04 + a 2-package apt install).
#   - build:image:linux (pre-build stage) builds ci/docker/Dockerfile.linux
#     via kaniko on saas-linux and pushes to the project Container
#     Registry. Runs only when Dockerfile or .gitlab-ci.yml changes;
#     manual fallback otherwise.
#   - build:linux + test:linux:unit run on saas-linux using the prebuilt
#     ci-linux:latest image (so no apt-install at job time — toolchain
#     comes baked into the image).
# The self-hosted weeb-cluster runner is parked while its k8s infra
# settles; once the cluster is stable, flip these tags back to
# weeb-cluster to win on the ninja compile step. (See AGENTS.md notes
# on Phase-6 self-hosting.)
# macOS: build + unit tests on GitLab.com's saas-macos-medium-m1 (Apple
# Silicon, brew preinstalled). Auto on default branch + MRs.
# `allow_failure: true` while it stabilises — flip to mandatory once
# it's green twice in a row.
# Windows: build + unit tests on GitLab.com's saas-windows-medium-amd64
# (Windows Server 2022, VS 2022 Build Tools + CMake preinstalled). Same
# auto-on-MR posture as macOS, same `allow_failure: true` until two
# green runs. Installer signing for releases is still Phase 6 work.
#
# Full multi-platform + signing pipeline lives in the plan at
# docs/plans/2026-04-12-001-feat-pedalboard-3-rewrite-plan.md (Appendix C).

stages:
  - lint
  - pre-build
  - build
  - test

variables:
  CI_DEBUG_TRACE: "false"              # AC-SE-19: never leak secrets to logs
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: "recursive"  # harmless in Phase 0; future-proofs
  CPM_SOURCE_CACHE: "${CI_PROJECT_DIR}/.cpm-cache"
  CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
  CCACHE_MAXSIZE: "2G"
  DEBIAN_FRONTEND: "noninteractive"
  CI_LINUX_IMAGE: "${CI_REGISTRY_IMAGE}/ci-linux:latest"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

.rules-default: &rules-default
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'   # initial dev branch

# macOS jobs run automatically on every MR push as well as default branch /
# v3-rewrite — the saas-macos-large-m2pro queue waits aren't the gate they
# used to be, and `allow_failure: true` on the build/test jobs keeps a slow
# macOS run from blocking the critical path of an MR.
.rules-macos: &rules-macos
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Windows jobs run on saas-windows-medium-amd64 (GitLab.com SaaS Windows
# runner). Same trigger conditions as macOS — MR pushes + default/v3-rewrite
# branches — and same `allow_failure: true` posture below until the runs
# stabilise. Signing-cert provisioning for installer builds remains Phase 6
# work and is not required by these CI jobs (we build + test only).
.rules-windows: &rules-windows
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Image build runs only when the recipe (Dockerfile) or pipeline that
# consumes it changes. NO `when: manual` catch-all: a manual-pending job
# in pre-build blocks downstream stages even with `optional: true` on
# build:linux's `needs:`, which would force the user to click the play
# button before every Linux build runs. Instead, a forced rebuild is
# triggered by setting `REBUILD_CI_IMAGE=true` via "Run pipeline" in
# the UI; otherwise the job is absent from the pipeline and build:linux
# pulls whatever :latest is already in the registry.
.rules-ci-image: &rules-ci-image
  - if: '$REBUILD_CI_IMAGE == "true"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - ci/docker/Dockerfile.linux
      - .gitlab-ci.yml
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes:
      - ci/docker/Dockerfile.linux
      - .gitlab-ci.yml

.cache-linux: &cache-linux
  cache:
    - key: "cpm-${CI_PROJECT_PATH_SLUG}"
      paths: [ .cpm-cache/ ]
      policy: pull-push
    - key: "ccache-${CI_JOB_NAME_SLUG}"
      paths: [ .ccache/ ]
      policy: pull-push

# Windows runner has no ccache (sccache is the analog but not yet wired).
# CPM cache alone is the big-ticket item — it saves the JUCE source tarball
# fetch (+ Catch2 etc.) per pipeline. ~50 MB cache, ~30 s saved on rerun.
.cache-windows: &cache-windows
  cache:
    - key: "cpm-${CI_PROJECT_PATH_SLUG}"
      paths: [ .cpm-cache/ ]
      policy: pull-push

# Lint-only setup: clang-format + just. Skips the heavy build toolchain
# that ci-linux:latest carries. Lint runs on saas-linux on a stock
# ubuntu:24.04 image to avoid blocking on cluster state for a check
# that takes <30 s.
.lint-setup: &lint-setup
  - apt-get update -qq
  - apt-get install -y --no-install-recommends clang-format-18 just
  - ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

# saas-macos-large-m2pro ships Xcode + Homebrew preinstalled but minimal
# beyond that. Install only what CMakePresets/just need; everything else
# (Apple Clang, AudioToolbox, CoreAudio frameworks) is already present.
.macos-setup: &macos-setup
  - brew update --quiet || true
  - brew install --quiet cmake ninja just pkg-config || true
  - cmake --version
  - ninja --version
  - just --version

# saas-windows-medium-amd64 ships Visual Studio 2022 Build Tools, CMake,
# git, and PowerShell 7 preinstalled. We use Ninja as our generator (per
# windows-dev preset), so we need to enter the VS dev shell before any
# cmake call so MSVC's cl.exe / link.exe are on PATH. vswhere finds the
# installation root; Launch-VsDevShell sets up the environment in-process.
# Ninja is bundled with VS Build Tools at <VS>\Common7\IDE\CommonExtensions\
# Microsoft\CMake\Ninja\ninja.exe — Launch-VsDevShell adds it to PATH too.
#
# vswhere flags: `-latest -prerelease -products *` is the broadest match;
# the SaaS runner has Build Tools (not "regular" VS), and a default
# `-latest -property installationPath` returns empty without the
# -prerelease + -products * combo. -requires VC.Tools narrows to installs
# that actually have the C++ compiler. -format json + Select-Object
# -First 1 is safer than the bare -property form (avoids parsing edge
# cases when multiple installs are present).
.windows-setup: &windows-setup
  # juceaide failure — root cause finally identified in pipeline #136's
  # diagnostic dump. Direct `juceaide.exe version` invocation returned
  # exit code -1073741515 (0xC0000135 / STATUS_DLL_NOT_FOUND), not the
  # Defender termination we initially suspected. JUCE's sub-cmake builds
  # juceaide with CMake's default MSVC runtime selection, which on
  # CMake 3.27 without CMP0091 NEW resolves to /MDd (dynamic debug
  # runtime). The Debug runtime DLLs (ucrtbased.dll, msvcp140d.dll,
  # vcruntime140d.dll) ship with VS but live under VC\Redist\..\debug_nonredist
  # — Launch-VsDevShell.ps1 -Arch amd64 only adds the Release runtime
  # paths. juceaide.exe loads those debug DLLs, can't find them on PATH,
  # exits 0xC0000135 with no console output.
  #
  # Fix: after VsDevShell, locate Microsoft.VC*.DebugCRT under the VS
  # install and prepend it to PATH so juceaide can resolve its imports.
  # Defender disable is kept (cheap, does no harm).
  - 'Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue'
  - '$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"'
  - 'if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }'
  - '$installRoot = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath'
  - 'if (-not $installRoot) { throw "No Visual Studio install with C++ tools found by vswhere." }'
  - 'Write-Host "VS install root: $installRoot"'
  - '$devShell = Join-Path $installRoot ''Common7\Tools\Launch-VsDevShell.ps1'''
  - 'if (-not (Test-Path $devShell)) { throw "VS dev shell not found at $devShell" }'
  - '& $devShell -Arch amd64 -SkipAutomaticLocation'
  # MSVC Debug runtime DLLs — required by anything cmake builds with
  # /MDd. Pipeline #137 identified that the BuildTools install only ships
  # the OneCore subset under VC\Redist\MSVC\<ver>\onecore\debug_nonredist\x64\,
  # which is missing ucrtbased.dll. UCRT (Universal C Runtime) debug
  # ships separately under the Windows 10 SDK at
  # Windows Kits\10\bin\<sdk-version>\x64\ucrt\. Both directories must
  # be on PATH for juceaide.exe to load.
  - '$debugCrt = Get-ChildItem -Path "$installRoot\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.DebugCRT" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\debug_nonredist\x64\*" } | Sort-Object @{Expression={$_.FullName -like "*\onecore\*"}; Ascending=$true}, @{Expression={$_.Name}; Descending=$true} | Select-Object -First 1'
  - 'if ($debugCrt) { $env:PATH = "$($debugCrt.FullName);$env:PATH"; Write-Host "Added MSVC DebugCRT: $($debugCrt.FullName)" } else { Write-Host "WARNING: Microsoft.VC*.DebugCRT not found under $installRoot — juceaide may STATUS_DLL_NOT_FOUND" }'
  # Windows SDK debug UCRT (ucrtbased.dll). Picks the most recent SDK by
  # bin\<version> dir name. WindowsSdkDir is set by Launch-VsDevShell;
  # fall back to the canonical Program Files location if not.
  - '$sdkRoot = if ($env:WindowsSdkDir) { $env:WindowsSdkDir } else { "C:\Program Files (x86)\Windows Kits\10" }'
  - 'Write-Host "Windows SDK root: $sdkRoot"'
  - '$ucrtDebug = Get-ChildItem -Path "$sdkRoot\bin" -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)\x64\ucrt\ucrtbased.dll" } | Sort-Object Name -Descending | Select-Object -First 1'
  - 'if ($ucrtDebug) { $ucrtDir = "$($ucrtDebug.FullName)\x64\ucrt"; $env:PATH = "$ucrtDir;$env:PATH"; Write-Host "Added UCRT debug: $ucrtDir" } else { Write-Host "WARNING: ucrtbased.dll not found under $sdkRoot\bin — juceaide will STATUS_DLL_NOT_FOUND" }'
  - cmake --version
  - ninja --version

# ===========================================================================
# LINT
# ===========================================================================
lint:format:
  stage: lint
  image: ubuntu:24.04
  rules: *rules-default
  before_script: *lint-setup
  script:
    - just format-check

# ===========================================================================
# PRE-BUILD — build the Linux CI image once per Dockerfile change
# ===========================================================================
# Runs on saas-linux (no tag), not weeb-cluster: image build is I/O-bound
# (apt downloads, cmake/ninja tarballs from GitHub, layer push to the
# Container Registry). saas-linux is on GitLab's backbone, so push is
# faster than from home-cluster egress. weeb-cluster's 4 vCPU advantage
# only matters for ninja compiles (build:linux), not Dockerfile builds.
build:image:linux:
  stage: pre-build
  rules: *rules-ci-image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    # Auth to the project's Container Registry via CI_JOB_TOKEN. Kaniko
    # reads /kaniko/.docker/config.json on startup.
    - mkdir -p /kaniko/.docker
    - >
      printf '{"auths":{"%s":{"auth":"%s"}}}'
      "${CI_REGISTRY}"
      "$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 -w0)"
      > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/ci/docker/Dockerfile.linux"
      --destination "${CI_REGISTRY_IMAGE}/ci-linux:latest"
      --destination "${CI_REGISTRY_IMAGE}/ci-linux:${CI_COMMIT_SHORT_SHA}"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/ci-linux/cache"
      --snapshot-mode=redo

# ===========================================================================
# BUILD
# ===========================================================================
build:linux:
  stage: build
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-default
  needs:
    - job: build:image:linux
      optional: true
  <<: *cache-linux
  variables:
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  script:
    - ccache --zero-stats || true
    - cmake --preset linux-dev -S app-v3
    - cmake --build --preset linux-dev -- -j$(nproc)
    - ccache --show-stats || true
  artifacts:
    paths:
      - build/linux-dev/
    expire_in: 1 day
    when: on_success

# Windows Debug build on saas-windows-medium-amd64 (GitLab.com SaaS).
# Same posture as build:macos — auto on default/v3-rewrite/MR pushes,
# `allow_failure: true` while it stabilises. Flip mandatory once the
# job is green twice in a row. PowerShell shell (default on the SaaS
# Windows runner). Installer signing-cert provisioning is still Phase
# 6 work and is unrelated to this build+test pair.
build:windows:
  stage: build
  tags: [ saas-windows-medium-amd64 ]
  rules: *rules-windows
  allow_failure: true
  <<: *cache-windows
  before_script: *windows-setup
  script:
    # Wrap cmake configure so that on the recurring "Testing juceaide
    # failed" path (#131-#135) we get a real diagnostic dump rather
    # than just CMake's empty-output FATAL_ERROR. Defender is already
    # ruled out (whoami confirms admin, Get-MpPreference confirms
    # RTP=disabled + ExclusionProcess=juceaide.exe, yet juceaide still
    # produces empty stdout + non-zero exit). The only way to learn
    # what's actually killing it is to run the just-built juceaide.exe
    # ourselves, outside JUCE's execute_process, and inspect what
    # happens. Once we know the cause we can fix it and the wrapper
    # can be removed.
    - |
      $configureFailed = $false
      cmake --preset windows-dev -S app-v3
      if ($LASTEXITCODE -ne 0) {
          $configureFailed = $true
          Write-Host "=== cmake configure failed (likely juceaide); diagnosing ==="
          $juceaide = Get-ChildItem -Path "build" -Recurse -Filter "juceaide.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($juceaide) {
              Write-Host "juceaide path: $($juceaide.FullName)"
              Write-Host "size: $($juceaide.Length) bytes"
              Write-Host "lastWrite: $($juceaide.LastWriteTime)"
              Write-Host "--- file properties ---"
              try { Get-ItemProperty -Path $juceaide.FullName | Format-List | Out-String | Write-Host } catch {}
              Write-Host "--- dumpbin /dependents juceaide.exe ---"
              try { & dumpbin.exe /dependents $juceaide.FullName | Out-String | Write-Host } catch { Write-Host "dumpbin not available: $_" }
              Write-Host "--- effective PATH ---"
              $env:PATH -split ';' | Where-Object { $_ -match 'DebugCRT|ucrt|debug_nonredist|Windows Kits' } | ForEach-Object { Write-Host "  $_" }
              Write-Host "--- direct invocation: juceaide.exe version ---"
              $stderrFile = New-TemporaryFile
              $proc = Start-Process -FilePath $juceaide.FullName -ArgumentList "version" -NoNewWindow -PassThru -Wait `
                  -RedirectStandardOutput "juceaide_stdout.txt" -RedirectStandardError $stderrFile.FullName
              Write-Host "exit code: $($proc.ExitCode)"
              if (Test-Path "juceaide_stdout.txt") {
                  Write-Host "stdout:"; Get-Content "juceaide_stdout.txt" | Out-String | Write-Host
              }
              if (Test-Path $stderrFile.FullName) {
                  Write-Host "stderr:"; Get-Content $stderrFile.FullName | Out-String | Write-Host
              }
              Write-Host "--- last EventLog Application errors (5) ---"
              try { Get-EventLog -LogName Application -EntryType Error -Newest 5 -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host } catch {}
          } else {
              Write-Host "juceaide.exe not found under build/ — sub-cmake build never produced it"
          }
          throw "cmake configure failed (see diagnostic above)"
      }
    - cmake --build --preset windows-dev -- -j $env:NUMBER_OF_PROCESSORS
  artifacts:
    paths:
      - build/windows-dev/
    expire_in: 1 day
    when: on_success

# macOS Debug build on GitLab.com's saas-macos-large-m2pro (Apple Silicon).
# `allow_failure: true` while the job stabilises — flip to mandatory once
# it's green twice in a row. Auto on default branch, manual on MRs (see
# .rules-macos for why).
build:macos:
  stage: build
  tags: [ saas-macos-medium-m1 ]
  rules: *rules-macos
  allow_failure: true
  before_script: *macos-setup
  script:
    - cmake --preset macos-dev -S app-v3
    - cmake --build --preset macos-dev -- -j$(sysctl -n hw.ncpu)
  artifacts:
    paths:
      - build/macos-dev/
    expire_in: 1 day
    when: on_success

# ===========================================================================
# TEST
# ===========================================================================
test:linux:unit:
  stage: test
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-default
  needs: [ build:linux ]
  <<: *cache-linux
  script:
    - ctest --preset linux-dev

test:macos:unit:
  stage: test
  tags: [ saas-macos-medium-m1 ]
  rules: *rules-macos
  needs: [ build:macos ]
  allow_failure: true
  before_script: *macos-setup
  script:
    - ctest --preset macos-dev

test:windows:unit:
  stage: test
  tags: [ saas-windows-medium-amd64 ]
  rules: *rules-windows
  needs: [ build:windows ]
  allow_failure: true
  <<: *cache-windows
  before_script: *windows-setup
  script:
    - ctest --preset windows-dev
