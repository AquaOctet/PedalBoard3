# Pedalboard 3 — GitLab CI pipeline.
#
# Linux: lint + build + unit tests on a stock ubuntu:24.04 image with
# inline apt installs (custom Dockerfile is Phase 6 work).
# macOS: build + unit tests on GitLab.com's saas-macos-large-m2pro
# (Apple Silicon, brew preinstalled). `allow_failure: true` while the
# job stabilises — flip to mandatory once it's green twice in a row.
# Windows: still a manual stub awaiting signing-cert provisioning
# (Phase 6).
#
# Full multi-platform + signing pipeline lives in the plan at
# docs/plans/2026-04-12-001-feat-pedalboard-3-rewrite-plan.md (Appendix C).

stages:
  - lint
  - build
  - test

variables:
  CI_DEBUG_TRACE: "false"              # AC-SE-19: never leak secrets to logs
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: "recursive"  # harmless in Phase 0; future-proofs
  CPM_SOURCE_CACHE: "${CI_PROJECT_DIR}/.cpm-cache"
  CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
  CCACHE_MAXSIZE: "2G"
  DEBIAN_FRONTEND: "noninteractive"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

.rules-default: &rules-default
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_BRANCH == "v3-rewrite"'   # initial dev branch

.cache-linux: &cache-linux
  cache:
    - key: "cpm-${CI_PROJECT_PATH_SLUG}"
      paths: [ .cpm-cache/ ]
      policy: pull-push
    - key: "ccache-${CI_JOB_NAME_SLUG}"
      paths: [ .ccache/ ]
      policy: pull-push

# Install the bare-minimum toolchain on top of ubuntu:24.04. Replaced by the
# custom Dockerfile image in Phase 6.
.ubuntu-setup: &ubuntu-setup
  - apt-get update -qq
  - >
    apt-get install -y --no-install-recommends
    ca-certificates curl git
    build-essential cmake ninja-build pkg-config
    clang-18 clang-format-18
    libasound2-dev libjack-jackd2-dev
    libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
    libxext-dev libxcomposite-dev libxrender-dev
    libfreetype-dev libfontconfig1-dev
    libgl-dev libglu1-mesa-dev
    libcurl4-openssl-dev libwebkit2gtk-4.1-dev
    ccache just
  - ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

# saas-macos-large-m2pro ships Xcode + Homebrew preinstalled but minimal
# beyond that. Install only what CMakePresets/just need; everything else
# (Apple Clang, AudioToolbox, CoreAudio frameworks) is already present.
.macos-setup: &macos-setup
  - brew update --quiet || true
  - brew install --quiet cmake ninja just pkg-config || true
  - cmake --version
  - ninja --version
  - just --version

# ===========================================================================
# LINT
# ===========================================================================
lint:format:
  stage: lint
  image: ubuntu:24.04
  rules: *rules-default
  before_script: *ubuntu-setup
  script:
    - just format-check

# ===========================================================================
# BUILD
# ===========================================================================
build:linux:
  stage: build
  image: ubuntu:24.04
  rules: *rules-default
  <<: *cache-linux
  variables:
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  before_script: *ubuntu-setup
  script:
    - ccache --zero-stats || true
    - cmake --preset linux-dev -S app-v3
    - cmake --build --preset linux-dev -- -j$(nproc)
    - ccache --show-stats || true
  artifacts:
    paths:
      - build/linux-dev/
    expire_in: 1 day
    when: on_success

# Windows is still a manual stub: signing-cert provisioning is Phase 6 work.
build:windows:
  stage: build
  tags: [ saas-windows-medium-amd64 ]
  rules:
    - when: manual
  allow_failure: true
  script:
    - echo "Phase 6 stub — waiting on self-hosted Windows runner + signing creds."
    - exit 1

# macOS Debug build on GitLab.com's saas-macos-large-m2pro (Apple Silicon).
# `allow_failure: true` while the job stabilises — flip to mandatory once
# it's green twice in a row. Same rules as Linux jobs (run on MR + main).
build:macos:
  stage: build
  tags: [ saas-macos-large-m2pro ]
  rules: *rules-default
  allow_failure: true
  before_script: *macos-setup
  script:
    - cmake --preset macos-dev -S app-v3
    - cmake --build --preset macos-dev -- -j$(sysctl -n hw.ncpu)
  artifacts:
    paths:
      - build/macos-dev/
    expire_in: 1 day
    when: on_success

# ===========================================================================
# TEST
# ===========================================================================
test:linux:unit:
  stage: test
  image: ubuntu:24.04
  rules: *rules-default
  needs: [ build:linux ]
  <<: *cache-linux
  before_script: *ubuntu-setup
  script:
    - ctest --preset linux-dev

test:macos:unit:
  stage: test
  tags: [ saas-macos-large-m2pro ]
  rules: *rules-default
  needs: [ build:macos ]
  allow_failure: true
  before_script: *macos-setup
  script:
    - ctest --preset macos-dev
