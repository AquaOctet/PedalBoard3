# Pedalboard 3 — GitLab CI pipeline.
#
# Linux: lint:format, build:linux and test:linux:unit run on saas-linux inside
#   the silkOps factory image `juce-linux` (void-realm-solutions/ci-cd),
#   pinned to an immutable tag in CI_LINUX_IMAGE below. The toolchain
#   (clang-18, CMake, Ninja, ccache, just, JUCE dev libs) is baked in, so no
#   job installs anything; bumping the image is a one-line tag change here.
#   Pulling it requires this project to be on ci-cd's job-token allow-list
#   (Settings > CI/CD > Job token permissions on ci-cd).
# macOS: build + unit tests on GitLab.com's saas-macos-medium-m1 (Apple
#   Silicon, Homebrew preinstalled), allow_failure.
# Windows: build + unit tests in ONE job on GitLab.com's
#   saas-windows-medium-amd64 (Windows Server 2022, VS 2022 Build Tools and
#   CMake preinstalled), allow_failure. MSVC objects are cached with ccache
#   (/Z7 debug info, so the objects are cacheable); a warm cache turns the
#   ~25 min JUCE compile into a few minutes. ctest runs in the build job
#   because a second Windows VM boot + setup costs more than the tests.
# Signing is #40.
#
# Full multi-platform + signing pipeline lives in the plan at
# docs/plans/2026-04-12-001-feat-pedalboard-3-rewrite-plan.md (Appendix C).

# When a pipeline runs at all:
#   - every merge request push: the gate (lint, and build + unit tests on
#     Linux, Windows and macOS);
#   - main, only when someone starts a pipeline by hand (Build > Pipelines >
#     Run pipeline, or `glab ci run -b main`). It holds just the release
#     builds, each still a click of its own, so only the platforms wanted
#     spend runner minutes. A merge into main starts no pipeline: its MR was
#     already green;
#   - a release tag, v<version> (v1.0.0-beta.1, say): the three release builds
#     run by themselves and package, then release:gitlab makes the GitLab
#     Release (docs/releases/README.md). Pushing the tag is a maintainer's job.
# Nothing else (plain branch pushes, other tags) starts one.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'

stages:
  - lint
  - build
  - test
  - release
  - publish

variables:
  CI_DEBUG_TRACE: "false"              # AC-SE-19: never leak secrets to logs
  GIT_DEPTH: "20"
  CPM_SOURCE_CACHE: "${CI_PROJECT_DIR}/.cpm-cache"
  CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
  CCACHE_MAXSIZE: "2G"
  # silkOps factory image, immutable tag (never :latest). Registry root is
  # named explicitly, not via $CI_REGISTRY_IMAGE, which would resolve to
  # this project's own registry.
  CI_LINUX_IMAGE: "registry.gitlab.com/void-realm-solutions/ci-cd/juce-linux:18-r1"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

# The gate (lint, and build + unit tests on each platform): every merge
# request push. Not main: a merge was already green on its MR, and a pipeline
# started by hand on main is for the release builds (see workflow). Windows
# and macOS set allow_failure on the job, which keeps a slow SaaS runner off
# an MR's critical path.
.rules-gate: &rules-gate
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Release jobs build and package one platform each (#88).
#   - On a release tag they run by themselves and must pass: release:gitlab
#     waits for all three.
#   - On main (in a pipeline started by hand) and in merge requests, each is
#     a manual click, so only the platforms wanted spend runner minutes, and
#     an MR's packages can be tried before it merges. allow_failure keeps an
#     un-clicked job from leaving the pipeline "blocked".
# They live in the `release` stage so a pending manual job never blocks the
# earlier stages (a manual-pending job in an early stage blocks downstream
# stages even with `optional: true` on `needs:`).
.rules-release: &rules-release
  - if: '$CI_COMMIT_TAG'
    allow_failure: false
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    when: manual
    allow_failure: true
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: manual
    allow_failure: true

# On a release tag, the packages go to this project's package registry as
# pedalboard3/<version> (the tag without its v), where release:gitlab links
# them. Otherwise they stay job artifacts only.
.upload-packages-unix: &upload-packages-unix
  - |
    if [ -n "${CI_COMMIT_TAG:-}" ]; then
      for f in packages/*.zip packages/*.tar.gz; do
        [ -f "$f" ] || continue
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pedalboard3/${CI_COMMIT_TAG#v}/$(basename "$f")"
        echo "Uploaded $(basename "$f")"
      done
    fi

# Build caches: CPM's dependency sources (JUCE, Catch2, ...), shared by every
# job, and the compiler cache, keyed per job so Debug (build:*) and
# RelWithDebInfo (release:*) objects don't evict each other. On Windows,
# ccache 4.x speaks cl.exe; .windows-setup puts it on the runner.
.cache-build: &cache-build
  cache:
    - key: "cpm-${CI_PROJECT_PATH_SLUG}"
      paths: [ .cpm-cache/ ]
      policy: pull-push
    - key: "ccache-${CI_JOB_NAME_SLUG}"
      paths: [ .ccache/ ]
      policy: pull-push

# saas-macos-medium-m1 ships Xcode + Homebrew preinstalled but minimal
# beyond that. Install only what CMakePresets/just need; everything else
# (Apple Clang, AudioToolbox, CoreAudio frameworks) is already present.
.macos-setup: &macos-setup
  - brew update --quiet || true
  - brew install --quiet cmake ninja just pkg-config || true
  - cmake --version
  - ninja --version
  - just --version

# saas-windows-medium-amd64 ships Visual Studio 2022 Build Tools, CMake,
# git, and PowerShell 7 preinstalled. We use Ninja as our generator (per
# windows-dev preset), so we need to enter the VS dev shell before any
# cmake call so MSVC's cl.exe / link.exe are on PATH. vswhere finds the
# installation root; Launch-VsDevShell sets up the environment in-process.
# Ninja is bundled with VS Build Tools at <VS>\Common7\IDE\CommonExtensions\
# Microsoft\CMake\Ninja\ninja.exe — Launch-VsDevShell adds it to PATH too.
#
# vswhere flags: `-latest -prerelease -products *` is the broadest match;
# the SaaS runner has Build Tools (not "regular" VS), and a default
# `-latest -property installationPath` returns empty without the
# -prerelease + -products * combo. -requires VC.Tools narrows to installs
# that actually have the C++ compiler. -format json + Select-Object
# -First 1 is safer than the bare -property form (avoids parsing edge
# cases when multiple installs are present).
.windows-setup: &windows-setup
  # ccache for MSVC (pinned release zip, sha256-verified, no package manager
  # round-trip). CMake picks the launcher up from the CMAKE_*_COMPILER_LAUNCHER
  # environment variables. The debug-info format has NO environment form, so
  # the configure lines below pass -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
  # explicitly: that switches Debug from /Zi (PDB side-channel, which ccache
  # reports as "unsupported compiler option" — 294/294 uncacheable on the
  # first attempt) to /Z7 (debug info inside the .obj). cmake_minimum_required
  # is 3.25, so policy CMP0141 is already NEW and the variable is honoured.
  # A failed download leaves ccache unset and the build proceeds uncached.
  - |
      $ccacheVer  = "4.11.3"
      $ccacheSha  = "bfd031cad091b7db7e68c3303be542b0f7fee7a3e716d76ec6f7e6c7ef4b3526"
      $ccacheDir  = Join-Path $env:CI_PROJECT_DIR ".tools\ccache-$ccacheVer-windows-x86_64"
      if (-not (Test-Path (Join-Path $ccacheDir "ccache.exe"))) {
          $zip = Join-Path $env:CI_PROJECT_DIR "ccache.zip"
          curl.exe --fail --silent --show-error --location --output $zip "https://github.com/ccache/ccache/releases/download/v$ccacheVer/ccache-$ccacheVer-windows-x86_64.zip"
          if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -eq $ccacheSha)) {
              Expand-Archive -Force -Path $zip -DestinationPath (Join-Path $env:CI_PROJECT_DIR ".tools")
          } else {
              Write-Warning "ccache download or checksum failed; building without a compiler cache."
          }
          Remove-Item $zip -ErrorAction SilentlyContinue
          cmd /c "exit 0"
      }
      if (Test-Path (Join-Path $ccacheDir "ccache.exe")) {
          $env:PATH = "$ccacheDir;$env:PATH"
          $env:CMAKE_C_COMPILER_LAUNCHER   = "ccache"
          $env:CMAKE_CXX_COMPILER_LAUNCHER = "ccache"
          $env:CMAKE_MSVC_DEBUG_INFORMATION_FORMAT = "Embedded"
          ccache --version | Select-Object -First 1
          ccache --zero-stats | Out-Null
      }
  # juceaide (JUCE's build helper, built during configure) links the Debug
  # runtime (/MDd), whose DLLs Launch-VsDevShell doesn't put on PATH: it would
  # exit 0xC0000135 (DLL not found) with no output. So after the dev shell,
  # the MSVC DebugCRT and the SDK's debug UCRT (ucrtbased.dll) go on PATH.
  # Defender's real-time scan is switched off to speed the build up.
  - 'Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue'
  - '$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"'
  - 'if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }'
  - '$installRoot = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath'
  - 'if (-not $installRoot) { throw "No Visual Studio install with C++ tools found by vswhere." }'
  - 'Write-Host "VS install root: $installRoot"'
  - '$devShell = Join-Path $installRoot ''Common7\Tools\Launch-VsDevShell.ps1'''
  - 'if (-not (Test-Path $devShell)) { throw "VS dev shell not found at $devShell" }'
  - '& $devShell -Arch amd64 -SkipAutomaticLocation'
  - '$debugCrt = Get-ChildItem -Path "$installRoot\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.DebugCRT" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\debug_nonredist\x64\*" } | Sort-Object @{Expression={$_.FullName -like "*\onecore\*"}; Ascending=$true}, @{Expression={$_.Name}; Descending=$true} | Select-Object -First 1'
  - 'if ($debugCrt) { $env:PATH = "$($debugCrt.FullName);$env:PATH"; Write-Host "Added MSVC DebugCRT: $($debugCrt.FullName)" } else { Write-Host "WARNING: Microsoft.VC*.DebugCRT not found under $installRoot — juceaide may STATUS_DLL_NOT_FOUND" }'
  - '$sdkRoot = if ($env:WindowsSdkDir) { $env:WindowsSdkDir } else { "C:\Program Files (x86)\Windows Kits\10" }'
  - 'Write-Host "Windows SDK root: $sdkRoot"'
  - '$ucrtDebug = Get-ChildItem -Path "$sdkRoot\bin" -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)\x64\ucrt\ucrtbased.dll" } | Sort-Object Name -Descending | Select-Object -First 1'
  - 'if ($ucrtDebug) { $ucrtDir = "$($ucrtDebug.FullName)\x64\ucrt"; $env:PATH = "$ucrtDir;$env:PATH"; Write-Host "Added UCRT debug: $ucrtDir" } else { Write-Host "WARNING: ucrtbased.dll not found under $sdkRoot\bin — juceaide will STATUS_DLL_NOT_FOUND" }'
  # No dcomp.dll here (DirectComposition; a Server Core runner), and it can't
  # be added: the App Compatibility feature install is "Access is denied", and
  # the VS and SDK folders don't carry one. The build script's delay-load
  # patch is what lets juceaide load without it.
  - cmake --version
  - ninja --version

# ===========================================================================
# LINT
# ===========================================================================
# The factory image already carries clang-format-18 and just, so lint is
# a single command with no setup step.
lint:format:
  stage: lint
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-gate
  script:
    - just format-check

# ===========================================================================
# BUILD
# ===========================================================================
build:linux:
  stage: build
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-gate
  <<: *cache-build
  # ccache: app-v3/CMakeLists.txt finds it in the image and uses it.
  variables:
    # Preset is a variable so release:linux can extend this job and only
    # swap in the RelWithDebInfo preset (linux-release).
    PB3_BUILD_PRESET: linux-dev
  script:
    - ccache --zero-stats || true
    - cmake --preset "$PB3_BUILD_PRESET" -S app-v3
    - cmake --build --preset "$PB3_BUILD_PRESET" -- -j$(nproc)
    - ccache --show-stats || true
  artifacts:
    paths:
      - build/linux-dev/
    # Exclude the CPM-fetched dependency tree (JUCE source + VST3 SDK +
    # their build objects, ~570 MB). The test stage runs ctest against our
    # compiled binaries + CTest metadata and never needs the JUCE sources;
    # JUCE links statically, so nothing under _deps is needed at run time.
    # This shrinks the artifact (and any manual download) from ~half a gig
    # to a few MB.
    exclude:
      - "build/linux-dev/_deps/**/*"
      # Our own intermediate objects + CMake internals — not needed once the
      # binaries are linked; this is the bulk of the remaining Debug artifact.
      - "build/linux-dev/**/CMakeFiles/**"
      - "build/linux-dev/**/*.o"
    expire_in: 1 day
    when: on_success

# Windows Debug build + unit tests on saas-windows-medium-amd64 (GitLab.com
# SaaS, PowerShell), on every MR push. `allow_failure: true` until the
# platform CI is made required (#33).
build:windows:
  stage: build
  tags: [ saas-windows-medium-amd64 ]
  rules: *rules-gate
  allow_failure: true
  <<: *cache-build
  before_script: *windows-setup
  variables:
    # Preset is a variable so release:windows can extend this job (reusing
    # all the dcomp/DLL setup below) and only swap in the RelWithDebInfo
    # preset (windows-ci).
    PB3_BUILD_PRESET: windows-dev
  script:
    - |
      # Fetch the Steinberg ASIO SDK from the project's private generic package
      # registry so the Windows build can enable JUCE_ASIO=1 (see the ASIO block
      # in app-v3/CMakeLists.txt and AGENTS.md "Windows: ASIO"). The SDK is GPLv3
      # but kept out of git; a maintainer uploads it once to
      # packages/generic/asio-sdk/<ver>/asio-sdk.zip. Best-effort: if the package
      # isn't there (not yet uploaded, or a fork without registry access) the build
      # continues with WASAPI/DirectSound only — this step never fails the job.
      # curl's non-zero exit does NOT throw in PowerShell, so check $LASTEXITCODE.
      $asioDest = "app-v3/asio_sdk"
      $asioUrl  = "$($env:CI_API_V4_URL)/projects/$($env:CI_PROJECT_ID)/packages/generic/asio-sdk/2.3.4/ASIO-SDK_2.3.4_2025-10-15.zip"
      curl.exe --fail --silent --show-error --location --header "JOB-TOKEN: $($env:CI_JOB_TOKEN)" --output asio-sdk.zip $asioUrl
      if ($LASTEXITCODE -eq 0 -and (Test-Path asio-sdk.zip)) {
          try {
              New-Item -ItemType Directory -Force $asioDest | Out-Null
              Expand-Archive -Force -Path asio-sdk.zip -DestinationPath $asioDest
              $hdr = Get-ChildItem -Path $asioDest -Recurse -Filter "iasiodrv.h" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hdr) { Write-Host "ASIO SDK ready: $($hdr.FullName) — JUCE_ASIO will be enabled" }
              else { Write-Warning "ASIO SDK archive fetched but iasiodrv.h not found under $asioDest; ASIO stays disabled." }
          } catch {
              Write-Warning "ASIO SDK archive could not be extracted; building WASAPI/DirectSound only. $_"
          }
      } else {
          Write-Warning "ASIO SDK package not available at $asioUrl; building WASAPI/DirectSound only."
      }
      Remove-Item asio-sdk.zip -ErrorAction SilentlyContinue
      # curl --fail exits non-zero on a 404, and GitLab's PowerShell executor
      # fails the whole step if $LASTEXITCODE != 0 at the block's end. This fetch
      # is best-effort and must never fail the build, so reset the exit code.
      cmd /c "exit 0"
    # Patch JUCE to delay-load dcomp.dll: juce_graphics imports it, this
    # runner doesn't have it, so juceaide would fail to load before main().
    # Delay-loaded, it's only resolved when a DirectComposition call is made,
    # which never happens in juceaide and always works on desktop Windows.
    # The patch lands in the CPM cache (kept by the job cache): the juceaide
    # CMakeLists (the part that holds) and a pragma in juce_graphics.cpp. When
    # the first configure fails (a cold cache, nothing to patch yet), patch
    # and configure again; a second failure prints juceaide's diagnostics.
    - |
      function Patch-JuceForDcomp {
          # Two patches, applied together:
          #   1. juce_graphics.cpp: pragma fallback (best-effort).
          #   2. extras/Build/juceaide/CMakeLists.txt: explicit
          #      target_link_options + delayimp link. THIS is the
          #      load-bearing one — pragmas in source proved
          #      unreliable at making /DELAYLOAD stick (pipeline #141).
          $cpmRoot = "$env:CI_PROJECT_DIR\.cpm-cache\juce"
          if (-not (Test-Path $cpmRoot)) { return $false }
          $any = $false
          foreach ($juceDir in (Get-ChildItem -Path $cpmRoot -Directory)) {
              $cpp = Join-Path $juceDir.FullName "modules\juce_graphics\juce_graphics.cpp"
              if (Test-Path $cpp) {
                  $content = Get-Content $cpp -Raw
                  if ($content -notmatch 'DELAYLOAD:dcomp\.dll') {
                      $marker = '#pragma comment(lib, "DComp.lib")'
                      $insert = "$marker`r`n  #pragma comment(lib, `"delayimp.lib`")`r`n  #pragma comment(linker, `"/DELAYLOAD:dcomp.dll`")"
                      $new = $content.Replace($marker, $insert)
                      if ($new -ne $content) {
                          Set-Content -Path $cpp -Value $new -NoNewline
                          Write-Host "Patched source pragma: $cpp"
                          $any = $true
                      }
                  }
              }

              $cml = Join-Path $juceDir.FullName "extras\Build\juceaide\CMakeLists.txt"
              if (Test-Path $cml) {
                  $cmlContent = Get-Content $cml -Raw
                  if ($cmlContent -notmatch 'PB3_DELAYLOAD_DCOMP') {
                      $cmlMarker = 'juce::juce_recommended_warning_flags)'
                      $cmlInsert = "$cmlMarker`r`n`r`n# PB3_DELAYLOAD_DCOMP — delay-load dcomp.dll so juceaide loads on`r`n# Server Core runners that lack DirectComposition.`r`nif(MSVC)`r`n    target_link_options(juceaide PRIVATE `"/DELAYLOAD:dcomp.dll`")`r`n    target_link_libraries(juceaide PRIVATE delayimp)`r`nendif()"
                      $cmlNew = $cmlContent.Replace($cmlMarker, $cmlInsert)
                      if ($cmlNew -ne $cmlContent) {
                          Set-Content -Path $cml -Value $cmlNew -NoNewline
                          Write-Host "Patched juceaide CMakeLists: $cml"
                          $any = $true
                      }
                  } else {
                      Write-Host "Already patched: $cml"
                  }
              }
          }
          return $any
      }

      Patch-JuceForDcomp | Out-Null

      cmake --preset $env:PB3_BUILD_PRESET -S app-v3 -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      if ($LASTEXITCODE -ne 0) {
          Write-Host "=== first cmake failed; patching JUCE for dcomp delay-load and retrying ==="
          $applied = Patch-JuceForDcomp
          if ($applied) {
              $juceTools = "build\$($env:PB3_BUILD_PRESET)\_deps\juce-build\tools"
              if (Test-Path $juceTools) { Remove-Item -Recurse -Force $juceTools -ErrorAction SilentlyContinue }
              cmake --preset $env:PB3_BUILD_PRESET -S app-v3 -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          }
          if ($LASTEXITCODE -ne 0) {
              Write-Host "=== cmake configure still failing after delay-load patch; full diagnostic ==="
              $juceaide = Get-ChildItem -Path "build" -Recurse -Filter "juceaide.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($juceaide) {
                  Write-Host "juceaide path: $($juceaide.FullName)"
                  Write-Host "size: $($juceaide.Length) bytes"
                  Write-Host "lastWrite: $($juceaide.LastWriteTime)"
                  Write-Host "--- dumpbin /dependents juceaide.exe ---"
                  try { & dumpbin.exe /dependents $juceaide.FullName | Out-String | Write-Host } catch {}
                  Write-Host "--- direct invocation ---"
                  $stderrFile = New-TemporaryFile
                  $proc = Start-Process -FilePath $juceaide.FullName -ArgumentList "version" -NoNewWindow -PassThru -Wait `
                      -RedirectStandardOutput "juceaide_stdout.txt" -RedirectStandardError $stderrFile.FullName
                  Write-Host "exit code: $($proc.ExitCode)"
                  if (Test-Path "juceaide_stdout.txt") { Write-Host "stdout:"; Get-Content "juceaide_stdout.txt" | Out-String | Write-Host }
                  if (Test-Path $stderrFile.FullName) { Write-Host "stderr:"; Get-Content $stderrFile.FullName | Out-String | Write-Host }
              }
              throw "cmake configure failed even after delay-load patch"
          }
      }
    - cmake --build --preset $env:PB3_BUILD_PRESET -- -j $env:NUMBER_OF_PROCESSORS
    - 'if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache --show-stats -v }'
    # Unit tests in the same job: a separate test job would re-pay the VM boot,
    # cache restore and the whole setup above (~8-10 min) for a ~1 min ctest.
    - ctest --preset $env:PB3_BUILD_PRESET
  artifacts:
    paths:
      - build/windows-dev/
    # Exclude the ~570 MB CPM dependency tree — see build:linux for the
    # rationale (tests need our binaries, not the JUCE sources).
    exclude:
      - "build/windows-dev/_deps/**/*"
      # Intermediate objects + CMake internals — see build:linux.
      - "build/windows-dev/**/CMakeFiles/**"
      - "build/windows-dev/**/*.obj"
    expire_in: 1 day
    when: on_success

# macOS Debug build on GitLab.com's saas-macos-medium-m1 (Apple Silicon), on
# every MR push. `allow_failure: true` until the platform CI is made required
# (#33).
build:macos:
  stage: build
  tags: [ saas-macos-medium-m1 ]
  rules: *rules-gate
  allow_failure: true
  before_script: *macos-setup
  variables:
    # Preset is a variable so release:macos can extend this job and only
    # swap in the universal RelWithDebInfo preset (macos-universal).
    PB3_BUILD_PRESET: macos-dev
  script:
    - cmake --preset "$PB3_BUILD_PRESET" -S app-v3
    - cmake --build --preset "$PB3_BUILD_PRESET" -- -j$(sysctl -n hw.ncpu)
  artifacts:
    paths:
      - build/macos-dev/
    # Exclude the ~570 MB CPM dependency tree — see build:linux for the
    # rationale (tests need our binaries, not the JUCE sources).
    exclude:
      - "build/macos-dev/_deps/**/*"
      # Intermediate objects + CMake internals — see build:linux.
      - "build/macos-dev/**/CMakeFiles/**"
      - "build/macos-dev/**/*.o"
    expire_in: 1 day
    when: on_success

# ===========================================================================
# TEST
# ===========================================================================
test:linux:unit:
  stage: test
  image: "${CI_LINUX_IMAGE}"
  rules: *rules-gate
  needs: [ build:linux ]
  script:
    - ctest --preset linux-dev

test:macos:unit:
  stage: test
  tags: [ saas-macos-medium-m1 ]
  rules: *rules-gate
  needs: [ build:macos ]
  allow_failure: true
  before_script: *macos-setup
  script:
    - ctest --preset macos-dev

# ===========================================================================
# RELEASE — RelWithDebInfo builds, packaged (#88).
#
# Each job extends its build:* sibling, so it reuses the same runner setup
# and build script (on Windows the dcomp and DLL handling, and the unit
# tests). Then it packages what it built, with tools/package.ps1 or
# tools/package.sh:
#   - Windows: the installer (Inno Setup, installed on the runner) and the
#     portable zip. The exes carry the MSVC runtime; package.ps1 checks that.
#   - macOS: a zip of the universal .app, with the helper inside it.
#   - Linux: a tarball of the app and the helper.
# .rules-release says when they run. On a release tag each also checks that
# the tag matches the build's version, and uploads its packages for
# release:gitlab. Signing and notarisation are still #40.
# ===========================================================================
release:linux:
  extends: build:linux
  stage: release
  rules: *rules-release
  variables:
    PB3_BUILD_PRESET: linux-release
  script:
    - !reference [build:linux, script]
    - tools/package.sh build/linux-release packages
    - *upload-packages-unix
    # The bare version (no v), for release:gitlab's download links.
    - echo "PB3_VERSION=$(tr -d '[:space:]' < build/linux-release/pb3-version.txt)" > release.env
  artifacts:
    paths: [ packages/*.tar.gz ]
    reports:
      dotenv: release.env
    expire_in: 2 weeks
    when: on_success

release:macos:
  extends: build:macos
  stage: release
  rules: *rules-release
  variables:
    PB3_BUILD_PRESET: macos-universal
  script:
    - !reference [build:macos, script]
    - tools/package.sh build/macos-universal packages
    - *upload-packages-unix
  artifacts:
    paths: [ packages/*.zip ]
    expire_in: 2 weeks
    when: on_success

release:windows:
  extends: build:windows
  stage: release
  rules: *rules-release
  variables:
    PB3_BUILD_PRESET: windows-ci
  script:
    - !reference [build:windows, script]
    - |
      # Inno Setup for the installer: a pinned release, checked against its
      # SHA-256 before it runs, installed into the job's folder (the runner is
      # thrown away afterwards).
      $isVer = "6.7.3"
      $isSha = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
      $isExe = Join-Path $env:CI_PROJECT_DIR "innosetup-$isVer.exe"
      $isDir = Join-Path $env:CI_PROJECT_DIR ".tools\innosetup-$isVer"
      curl.exe --fail --silent --show-error --location --output $isExe "https://github.com/jrsoftware/issrc/releases/download/is-$($isVer.Replace('.', '_'))/innosetup-$isVer.exe"
      if ($LASTEXITCODE -ne 0) { throw "Couldn't download Inno Setup $isVer." }
      if ((Get-FileHash $isExe -Algorithm SHA256).Hash.ToLower() -ne $isSha) { throw "Inno Setup's checksum doesn't match, so it wasn't run." }
      Start-Process -FilePath $isExe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$isDir`"" -Wait
      if (-not (Test-Path "$isDir\ISCC.exe")) { throw "Inno Setup didn't install into $isDir." }
      & ./tools/package.ps1 -BuildDir build/windows-ci -OutDir packages -Iscc "$isDir\ISCC.exe"
    - |
      # On a release tag: upload, as .upload-packages-unix does.
      if ($env:CI_COMMIT_TAG) {
          $version = $env:CI_COMMIT_TAG.Substring(1)
          foreach ($f in Get-ChildItem -Path packages/* -File -Include *.zip, *-setup.exe) {
              curl.exe --fail --silent --show-error --header "JOB-TOKEN: $($env:CI_JOB_TOKEN)" --upload-file $f.FullName "$($env:CI_API_V4_URL)/projects/$($env:CI_PROJECT_ID)/packages/generic/pedalboard3/$version/$($f.Name)"
              if ($LASTEXITCODE -ne 0) { throw "Couldn't upload $($f.Name)." }
              Write-Host "Uploaded $($f.Name)"
          }
      }
  artifacts:
    paths:
      - packages/*.zip
      - packages/*-setup.exe
    expire_in: 2 weeks
    when: on_success

# ===========================================================================
# PUBLISH — the GitLab Release, for a release tag only (#88).
#
# The release jobs have uploaded their packages. This makes the Release: the
# notes from docs/releases/<tag>.md and a download link for each package.
# GitLab has no pre-release flag, so the notes say it's a beta. The GitHub
# mirror (#89) will mark it as a pre-release there.
# ===========================================================================
release:gitlab:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: release:linux
      artifacts: true # PB3_VERSION, from its dotenv report
    - job: release:macos
      artifacts: false
    - job: release:windows
      artifacts: false
  variables:
    GIT_DEPTH: "1"
  script:
    - echo "Releasing $CI_COMMIT_TAG (Pedalboard 3 $PB3_VERSION)"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Pedalboard 3 $PB3_VERSION"
    description: "docs/releases/$CI_COMMIT_TAG.md"
    assets:
      links:
        - name: "Windows installer (x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pedalboard3/${PB3_VERSION}/Pedalboard3-${PB3_VERSION}-windows-x64-setup.exe"
          link_type: package
        - name: "Windows portable zip (x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pedalboard3/${PB3_VERSION}/Pedalboard3-${PB3_VERSION}-windows-x64.zip"
          link_type: package
        - name: "macOS (Apple Silicon and Intel)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pedalboard3/${PB3_VERSION}/Pedalboard3-${PB3_VERSION}-macos-universal.zip"
          link_type: package
        - name: "Linux (x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pedalboard3/${PB3_VERSION}/Pedalboard3-${PB3_VERSION}-linux-x64.tar.gz"
          link_type: package
