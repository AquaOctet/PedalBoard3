[workspace]
resolver = "2"
members = [
    "crates/pedalboard-core",
    "crates/pedalboard-audio", 
    "crates/pedalboard-plugins",
    "crates/pedalboard-midi",
    "crates/pedalboard-gui",
    "crates/pedalboard-utils"
]

[workspace.package]
version = "3.0.0"
authors = ["Pedalboard3 Development Team"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.70"
repository = "https://github.com/pedalboard/pedalboard3"
description = "Modern audio plugin host for live performance"
keywords = ["audio", "music", "plugin", "vst", "host"]
categories = ["multimedia::audio"]

[workspace.dependencies]
# Core Rust audio ecosystem
cpal = { version = "0.15", default-features = false }
dasp = "0.11" 
fundsp = "0.17"
hound = "3.5"
rustfft = "6.2"

# Plugin hosting
vst = "0.3"
clap-sys = "0.3"

# GUI frameworks
egui = "0.24"
eframe = "0.24"
iced = "0.12"
tauri = "1.5"

# MIDI and OSC
midir = "0.9"
rosc = "0.10"

# Concurrency and threading
crossbeam = "0.8"
rayon = "1.8"
tokio = "1.35"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
bytemuck = "1.13"
once_cell = "1.19"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# High-performance profile for audio processing
[profile.release-audio]
inherits = "release"
lto = "fat" 
codegen-units = 1