[package]
name = "pedalboard-core"
version.workspace = true
authors.workspace = true  
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Main application and coordination for Pedalboard3"

[dependencies]
pedalboard-utils = { path = "../pedalboard-utils" }
pedalboard-audio = { path = "../pedalboard-audio" }
pedalboard-plugins = { path = "../pedalboard-plugins" }
pedalboard-midi = { path = "../pedalboard-midi" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
crossbeam = { workspace = true }
once_cell = { workspace = true }
clap = "4.4"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }

[[example]]
name = "audio_test"
path = "examples/audio_test.rs"

[[example]]
name = "plugin_scanner_test"
path = "examples/plugin_scanner_test.rs"

[[bin]]
name = "pedalboard3"
path = "src/main.rs"